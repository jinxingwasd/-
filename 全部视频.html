    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050509;
            font-family: 'Anton', sans-serif;
            overflow-x: hidden;
        }

        /* 视频卡片 */
        .video-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.33, 1, 0.68, 1);
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,140,255,0.2);
        }

        .video-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 0 35px rgba(0,140,255,0.25);
            border-color: rgba(0,140,255,0.4);
        }

        video {
            display: block;
            width: 100%;
            height: auto;
        }

        /* 返回按钮 */
        .back-btn {
            transition: all 0.3s ease;
            top: 2rem; left: 2rem;
        }

        .back-btn:hover {
            color: #fff;
            text-shadow: 0 0 15px #008cff;
        }

        /* 视频标题 */
        .video-title {
            font-size: 2rem;
            color: white;
            margin-bottom: 0.5rem;
        }

        /* 视频描述 */
        .video-desc {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.7);
            line-height: 1.8;
        }
    </style>
</head>
